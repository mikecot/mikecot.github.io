# Site settings
title: Mike Cotic
email: 
description: "Senior Software Engineer & Security Researcher"
show_excerpts: false

baseurl: ""
url: "https://mikecotic.github.io"

# GitHub repository
repository: mikecot/mikecot.github.io

# Social media
minima:
  social_links:
    github: mikecot


# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Page structure
header_pages:
  - posts.md
  - scams-in-the-wild.md
  - blockchain-infrastructure.md
  - cybersecurity-research.md
  - about.md

# Collections
collections:
  posts:
    output: true
    permalink: /:categories/:year/:month/:day/:title:output_ext

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

# Analytics (replace with your tracking ID if you have one)
# google_analytics: UA-XXXXXXXX-X

# Timezone
timezone: Europe/Budapest

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .gitignore
  - README.md